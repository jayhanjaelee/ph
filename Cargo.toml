[package]
name = "prompt-hub"
version = "0.1.0"
edition = "2021"
description = "Prompt Hub: AI Agent 용 prompt 저장소 CLI/TUI"
license = "MIT"
authors = ["Hanjae Lee <jayhanjaelee@gmail.com>"]

[lib]
name = "ph"
path = "src/lib.rs"

[[bin]]
name = "ph"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"
